name: Phase 11 Trace Audit

on:
  push:
    branches:
      - revision/search-behaviour-exact-reference
    paths:
      - scripts/phase11_trace_audit.py
      - .github/workflows/phase11-trace-audit.yml
      - results/validation/stage3-final/checkpoints.tar.gz
      - results/validation/stage3-final/core/**
      - results/validation/stage3-final/nca/**
      - data/Dry_Bean_Dataset.xlsx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace-provenance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 \
            pandas==2.2.3 \
            scipy==1.17.0 \
            scikit-learn==1.8.0 \
            openpyxl==3.1.5

      - name: Run Work Package A trace audit
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/phase11_trace_audit.py \
            --archive results/validation/stage3-final/checkpoints.tar.gz \
            --stage3-root results/validation/stage3-final \
            --dataset data/Dry_Bean_Dataset.xlsx \
            --source-commit afab0d45a359ba5de7b798820d488a3698771e25 \
            --output-dir results/validation/phase11-audit
          code=$?
          echo "$code" > results/validation/phase11-audit/audit_exit_code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat results/validation/phase11-audit/TRACE_AUDIT_REPORT.md
          exit 0

      - name: Commit audit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/validation/phase11-audit
          if git diff --cached --quiet; then
            echo "No audit evidence changes to commit."
          else
            git commit -m "phase11: archive trace provenance audit evidence"
            git push
          fi

      - name: Fail workflow if audit found provenance defects
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo "Trace provenance audit reported one or more failures."
          exit 1
