name: Phase 11 Parallel Exact Benchmark

on:
  push:
    branches:
      - revision/search-behaviour-exact-reference
    paths:
      - scripts/phase11_parallel_benchmark.py
      - .github/workflows/phase11-parallel-benchmark.yml
      - results/validation/phase11-exhaustive-benchmark/benchmark_sample.csv
      - src/budgeted_search.py
      - data/Dry_Bean_Dataset.xlsx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 \
            pandas==2.2.3 \
            scipy==1.17.0 \
            scikit-learn==1.8.0 \
            openpyxl==3.1.5

      - name: Run four-process exact benchmark
        id: benchmark
        shell: bash
        run: |
          set +e
          rm -rf results/validation/phase11-parallel-benchmark
          python scripts/phase11_parallel_benchmark.py \
            --dataset data/Dry_Bean_Dataset.xlsx \
            --serial-sample results/validation/phase11-exhaustive-benchmark/benchmark_sample.csv \
            --output-dir results/validation/phase11-parallel-benchmark \
            --seed 1001 \
            --workers 4
          code=$?
          echo "$code" > results/validation/phase11-parallel-benchmark/benchmark_exit_code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat results/validation/phase11-parallel-benchmark/PARALLEL_BENCHMARK_REPORT.md
          exit 0

      - name: Commit benchmark evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/validation/phase11-parallel-benchmark
          if git diff --cached --quiet; then
            echo "No parallel benchmark evidence changes to commit."
          else
            git commit -m "phase11: archive exact parallel benchmark"
            git push
          fi

      - name: Fail workflow if score reproduction failed
        if: steps.benchmark.outputs.exit_code != '0'
        run: |
          echo "Parallel exact benchmark did not reproduce serial scores."
          exit 1
