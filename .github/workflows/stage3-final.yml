name: Stage 3 final study

on:
  push:
    branches:
      - revision/evaluation-audit
    paths:
      - .github/workflows/stage3-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage3-final-study
  cancel-in-progress: false

jobs:
  run-stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout frozen revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/evaluation-audit
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-revision.txt

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-revision.txt

      - name: Verify test suite before execution
        run: python -m pytest -q

      - name: Run frozen Stage 3 core study
        run: |
          python scripts/run_stage3.py --output results/revision_runs/stage3-core-actions

      - name: Analyze Stage 3 core study
        run: |
          python scripts/analyze_stage3.py \
            --input results/revision_runs/stage3-core-actions \
            --output results/revision_runs/stage3-core-actions-analysis

      - name: Run frozen Stage 3 NCA suite
        run: |
          python scripts/run_stage3.py \
            --suite nca \
            --output results/revision_runs/stage3-nca-actions

      - name: Analyze Stage 3 NCA suite
        run: |
          python scripts/analyze_stage3.py \
            --input results/revision_runs/stage3-nca-actions \
            --output results/revision_runs/stage3-nca-actions-analysis

      - name: Assemble auditable validation evidence
        run: |
          set -euxo pipefail
          DEST=results/validation/stage3-final
          mkdir -p "$DEST/core" "$DEST/nca"

          cp results/revision_runs/stage3-core-actions/{config.json,manifest.json,metrics.csv,summary.csv,unit-statuses.json} "$DEST/core/"
          cp results/revision_runs/stage3-core-actions-analysis/analysis.json "$DEST/core/analysis.json"

          cp results/revision_runs/stage3-nca-actions/{config.json,manifest.json,metrics.csv,summary.csv,unit-statuses.json} "$DEST/nca/"
          cp results/revision_runs/stage3-nca-actions-analysis/analysis.json "$DEST/nca/analysis.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          base = Path("results/validation/stage3-final")
          c = json.loads((base / "core/unit-statuses.json").read_text())
          n = json.loads((base / "nca/unit-statuses.json").read_text())
          def counts(rows):
              out = {}
              for row in rows:
                  out[row["state"]] = out.get(row["state"], 0) + 1
              return out
          report = {
              "source_commit": os.environ.get("GITHUB_SHA"),
              "core_units": len(c),
              "core_states": counts(c),
              "nca_units": len(n),
              "nca_states": counts(n),
              "note": "Frozen Stage 3 protocol; core and NCA executed sequentially on one GitHub-hosted runner with numerical threads limited to one."
          }
          (base / "execution-summary.json").write_text(json.dumps(report, indent=2) + "\n")
          PY

          tar -czf "$DEST/checkpoints.tar.gz" \
            -C results/revision_runs \
            stage3-core-actions stage3-core-actions-analysis \
            stage3-nca-actions stage3-nca-actions-analysis

          SIZE=$(stat -c%s "$DEST/checkpoints.tar.gz")
          if [ "$SIZE" -gt 90000000 ]; then
            split -b 45M -d -a 2 "$DEST/checkpoints.tar.gz" "$DEST/checkpoints.tar.gz.part-"
            rm "$DEST/checkpoints.tar.gz"
          fi

          du -sh "$DEST"
          cat "$DEST/execution-summary.json"

      - name: Upload complete raw evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage3-final-evidence
          path: |
            results/revision_runs/stage3-core-actions
            results/revision_runs/stage3-core-actions-analysis
            results/revision_runs/stage3-nca-actions
            results/revision_runs/stage3-nca-actions-analysis
          retention-days: 30
          compression-level: 9

      - name: Commit frozen Stage 3 evidence
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/validation/stage3-final
          git commit -m "Archive completed Stage 3 frozen comparison evidence"
          git push origin HEAD:revision/evaluation-audit
